[project]
name = "planer"
version = "0.1.0"
description = "Detect and remove boundary arterfacts from membrane segmentations"
readme = "README.md"
authors = [
    { name = "Sam Holland", email = "hol_sam@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mrcfile>=1.5.4",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "typer>=0.27.2",
]

[project.scripts]
planer = "planer.cli:app"

[project.optional-dependencies]
view = [
    "magicgui>=0.10.2",
    "napari[pyqt6]>=0.9.2",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
